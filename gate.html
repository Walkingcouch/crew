<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew — Access Required</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #120f0b;
      --card: #1b1713;
      --border: rgba(255,255,255,.08);
      --border-hi: rgba(255,255,255,.14);
      --green: #1a4d33;
      --green-mid: #2d8055;
      --green-lt: #4db37c;
      --white: #fff;
      --text: rgba(255,255,255,.85);
      --muted: rgba(255,255,255,.38);
      --error: #f87171;
      --ff: 'DM Sans', -apple-system, system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--ff);
      background: var(--ink);
      color: var(--text);
    }

    .gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(45,128,85,.22) 0%, transparent 65%),
        var(--ink);
    }

    .gate-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 48px 44px 44px;
      box-shadow: 0 32px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
    }

    /* ── Logo ── */
    .gate-logo {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 36px;
    }
    .gate-logo-mark {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--green-mid), #1f5c3a);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(45,128,85,.35);
    }
    .gate-logo-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -.02em;
    }

    /* ── Heading ── */
    .gate-heading {
      font-size: 26px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -.03em;
      margin-bottom: 8px;
      line-height: 1.15;
    }
    .gate-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 36px;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 16px;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.38);
      margin-bottom: 8px;
    }
    .field-wrap {
      position: relative;
    }
    .field-input {
      width: 100%;
      background: rgba(255,255,255,.045);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 13px 16px;
      font-family: var(--ff);
      font-size: 15px;
      color: var(--white);
      outline: none;
      transition: border-color .18s, background .18s, box-shadow .18s;
      -webkit-appearance: none;
    }
    .field-input::placeholder { color: rgba(255,255,255,.2); }
    .field-input:focus {
      border-color: var(--green-lt);
      background: rgba(77,179,124,.06);
      box-shadow: 0 0 0 3px rgba(77,179,124,.12);
    }
    .field-input.has-toggle { padding-right: 48px; }

    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color .15s;
    }
    .pw-toggle:hover { color: rgba(255,255,255,.7); }

    /* ── Error ── */
    .error-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.22);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--error);
      animation: shake .35s ease;
    }
    .error-box.hidden { display: none; }

    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-5px)}
      40%{transform:translateX(5px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--green-mid), #236640);
      color: var(--white);
      font-family: var(--ff);
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 11px;
      padding: 14px;
      cursor: pointer;
      transition: opacity .18s, transform .12s, box-shadow .18s;
      margin-top: 8px;
      letter-spacing: -.01em;
      box-shadow: 0 4px 16px rgba(45,128,85,.3);
    }
    .btn-submit:hover { opacity: .92; box-shadow: 0 6px 22px rgba(45,128,85,.45); }
    .btn-submit:active { transform: scale(.98); opacity: 1; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Loading spinner on button ── */
    .btn-submit.loading { opacity: .7; pointer-events: none; }

    /* ── Footer ── */
    .gate-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,.15);
    }

    @media (max-width: 480px) {
      .gate-card { padding: 36px 28px 32px; border-radius: 18px; }
      .gate-heading { font-size: 22px; }
    }
  </style>
<link rel="stylesheet" href="/accessibility.css">
</head>
<body>
  <div class="gate">
    <div class="gate-card">
      <!-- Logo -->
      <div class="gate-logo">
        <div class="gate-logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <span class="gate-logo-name">Crew</span>
      </div>

      <!-- Heading -->
      <h1 class="gate-heading">Private preview</h1>
      <p class="gate-sub">Enter your access credentials to continue.</p>

      <!-- Error -->
      <div class="error-box hidden" id="error-box" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Incorrect username or password.
      </div>

      <!-- Form -->
      <form id="gate-form" autocomplete="on" novalidate>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <div class="field-wrap">
            <input
              class="field-input"
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="Enter username"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="field-wrap">
            <input
              class="field-input has-toggle"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter password"
              required
            >
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
              <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Continue →</button>
      </form>
    </div>

    <p class="gate-footer">© 2026 Crew Pty Ltd · All rights reserved</p>
  </div>

  <script>
    // If already authenticated, redirect immediately
    (function () {
      try {
        var d = localStorage.getItem('crew_auth');
        if (d) {
          var t = JSON.parse(d);
          if (t.exp > Date.now()) {
            var params = new URLSearchParams(location.search);
            var r = params.get('r');
            location.replace(r && /^\/[^\/]/.test(r) ? r : '/');
          }
        }
      } catch (e) {}
    })();

    // Password show/hide
    var pwInput = document.getElementById('password');
    var pwToggle = document.getElementById('pw-toggle');
    var eyeIcon = document.getElementById('eye-icon');
    var eyeOffPath = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    var eyeOnPath = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    pwToggle.addEventListener('click', function () {
      var isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? eyeOffPath : eyeOnPath;
      pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    // Form submission
    var form = document.getElementById('gate-form');
    var errorBox = document.getElementById('error-box');
    var submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var p = pwInput.value;

      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';

      // Small delay to feel deliberate
      setTimeout(function () {
        if (u === 'Crew2023!' && p === 'Crew2023!') {
          localStorage.setItem('crew_auth', JSON.stringify({
            exp: Date.now() + 7 * 24 * 60 * 60 * 1000
          }));
          submitBtn.textContent = 'Redirecting…';
          var params = new URLSearchParams(location.search);
          var r = params.get('r');
          location.replace(r && /^\/[^\/]/.test(r) ? r : '/');
        } else {
          errorBox.classList.remove('hidden');
          // Re-trigger animation
          void errorBox.offsetWidth;
          pwInput.value = '';
          pwInput.focus();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continue →';
        }
      }, 320);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset your password | Crew</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a4d33">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green: #1a4d33; --green2: #2d8055; --green3: #4db37c;
    --bg: #f4f6f3; --t1: #1a1a1a; --t2: #4a4a4a; --t3: #8a8a8a;
    --border: #e4e0db; --red: #c0392b; --amber: #c47b0a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--t1);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 36px; max-width: 400px; width: 100%;
    box-shadow: 0 4px 32px rgba(0,0,0,.10);
  }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: var(--t3); margin-bottom: 24px; line-height: 1.5; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--t2); margin-bottom: 6px; }
  .pw-field { position: relative; }
  .pw-field input {
    width: 100%; padding: 12px 44px 12px 14px; font-size: 14px; color: var(--t1);
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px;
    outline: none; font-family: inherit;
  }
  .pw-field input:focus { border-color: var(--green2); background: #fff; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 12px; color: var(--green2); font-weight: 700; padding: 4px;
  }
  .pw-strength { margin: -8px 0 16px; }
  .pw-strength-bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin-bottom: 5px; }
  .pw-strength-bar-fill { height: 100%; width: 0%; background: var(--red); transition: width .2s, background .2s; }
  .pw-strength-text { font-size: 11px; color: var(--t3); }
  .btn-primary {
    width: 100%; padding: 14px; font-size: 14px; font-weight: 700; color: #fff;
    background: var(--green); border: none; border-radius: 14px; cursor: pointer;
  }
  .btn-primary:hover { background: var(--green2); }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .alert {
    border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 500;
    margin-bottom: 14px; display: none; line-height: 1.5;
  }
  .alert.show { display: block; }
  .alert-err { background: #fdf0ef; color: var(--red); border: 1px solid #f5c6c2; }
  .alert-ok  { background: #edf5f0; color: var(--green); border: 1px solid #b8ddc8; }
  .hint { font-size: 12px; color: var(--t3); text-align: center; margin-top: 16px; }
  .hint a { color: var(--green2); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your Crew account.</p>

  <div class="alert alert-err" id="err"></div>
  <div class="alert alert-ok" id="ok"></div>

  <div id="form-wrap">
    <div class="form-group">
      <label>New password</label>
      <div class="pw-field">
        <input type="password" id="new-password" placeholder="At least 10 characters" autocomplete="new-password">
        <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()">Show</button>
      </div>
    </div>
    <div class="pw-strength">
      <div class="pw-strength-bar"><div class="pw-strength-bar-fill" id="pw-fill"></div></div>
      <div class="pw-strength-text" id="pw-text">Minimum 10 characters</div>
    </div>
    <button class="btn-primary" id="btn-submit" onclick="submitNewPassword()">Update password</button>
  </div>

  <p class="hint"><a href="/auth.html">Back to sign in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var db = supabase.createClient(
  'https://ggocdbsspynihtqlgozv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdnb2NkYnNzcHluaWh0cWxnb3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2Nzk1NzUsImV4cCI6MjA5MjI1NTU3NX0.jUlzuNmhqprLlKy-iM3qSNTnhtg6FUgwRKWMy2Y3kWA',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } }
);

var _hasRecoverySession = false;

db.auth.onAuthStateChange(function (event) {
  if (event === 'PASSWORD_RECOVERY') _hasRecoverySession = true;
});

window.addEventListener('load', async function () {
  var { data } = await db.auth.getSession();
  if (data && data.session) _hasRecoverySession = true;
});

function togglePw() {
  var input = document.getElementById('new-password');
  var btn = document.getElementById('pw-toggle');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
  else { input.type = 'password'; btn.textContent = 'Show'; }
}

document.getElementById('new-password').addEventListener('input', function () {
  updateStrength(this.value);
});

function updateStrength(value) {
  var fill = document.getElementById('pw-fill');
  var text = document.getElementById('pw-text');
  if (!value) { fill.style.width = '0%'; text.textContent = 'Minimum 10 characters'; return; }

  var score = 0;
  if (value.length >= 10) score++;
  if (value.length >= 14) score++;
  if (/[0-9]/.test(value) && /[a-zA-Z]/.test(value)) score++;
  if (/[^a-zA-Z0-9]/.test(value)) score++;

  var pct = [10, 35, 65, 85, 100][score];
  var colours = ['#c0392b', '#c0392b', '#c47b0a', '#4db37c', '#1a4d33'];
  var labels  = ['Too short (minimum 10 characters)', 'Weak', 'Fair', 'Good', 'Strong'];

  fill.style.width = (value.length < 10 ? 10 : pct) + '%';
  fill.style.background = colours[value.length < 10 ? 0 : score];
  text.textContent = value.length < 10 ? 'Minimum 10 characters (' + value.length + '/10)' : labels[score];
}

function showAlert(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}

async function submitNewPassword() {
  var password = document.getElementById('new-password').value;
  if (password.length < 10) { showAlert('err', 'Your password needs to be at least 10 characters.'); return; }
  if (!_hasRecoverySession) { showAlert('err', 'This reset link has expired. Request a new one from the sign-in page.'); return; }

  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Updating…';

  try {
    var { error } = await db.auth.updateUser({ password: password });
    if (error) throw error;
    document.getElementById('form-wrap').style.display = 'none';
    showAlert('ok', 'Password updated. Redirecting you to sign in…');
    setTimeout(function () { window.location.href = '/auth.html'; }, 1800);
  } catch (err) {
    showAlert('err', err.message || 'Could not update password.');
    btn.disabled = false;
    btn.textContent = 'Update password';
  }
}
</script>

</body>
</html>
